<style>
    body{
        font-family: 'Noto Sans Sinhala', Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        margin: 0;
        padding: 20px;
    }
    h1, h2 { text-align: center; }
    .container { max-width: 1200px; margin: auto; }

    .card{
        background: rgba(255,255,255,0.08);
        padding: 20px;
        margin: 15px 0;
        border-radius: 15px;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .current { border: 3px solid #00ff88; box-shadow: 0 0 25px #00ff88; }
    .next { border: 2px solid #3b82f6; }

    .subject { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
    .task { font-size: 20px; margin: 8px 0; }
    .timer { font-size: 42px; color: #00ff88; font-weight: bold; margin: 15px 0; }

    .checkbox {
        width: 32px; height: 32px; border: 3px solid #64748b; border-radius: 8px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 24px; cursor: pointer; flex-shrink: 0;
        transition: all 0.2s ease;
    }
    .checkbox.completed { background: #16a34a; border-color: #16a34a; color: white; }
    .checkbox.disabled { cursor: not-allowed; opacity: 0.4; }

    .task-row {
        display: flex; align-items: center; gap: 15px;
        padding: 12px; background: rgba(255,255,255,0.05);
        border-radius: 10px; margin-bottom: 8px;
        transition: transform 0.2s ease;
    }
    .task-row:hover { transform: translateX(5px); }
    .time-info { min-width: 110px; opacity: 0.8; }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
        margin: 20px 0;
    }
    .stat-card {
        background: rgba(255,255,255,0.1);
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        border-top: 4px solid #3b82f6;
        transition: transform 0.3s ease;
    }
    .stat-card:hover { transform: translateY(-5px); }
    .stat-card h3 { margin: 10px 0 5px 0; font-size: 28px; }
    .stat-card.success { border-top-color: #00ff88; }
    
    .charts-flex {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 25px;
    }
    .chart-container {

    }

let completedTasks = JSON.parse(localStorage.getItem('studyCompletedTasks')) || {};

// ==================== CORE FUNCTIONS ====================
function saveData() {
    localStorage.setItem('studyCompletedTasks', JSON.stringify(completedTasks));
}

function getTaskKey(day, index) { return `${day}-${index}`; }

function formatTime(sec){
    let h = Math.floor(sec/3600);
    let m = Math.floor((sec%3600)/60);
    let s = sec%60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function parseTime(timeStr) {
    const [hour, min] = timeStr.split(':').map(Number);
    return {hour, min};
}

function calculateDurationInHours(startStr, endStr) {
    let start = parseTime(startStr);
    let end = parseTime(endStr);
    let startMins = start.hour * 60 + start.min;
    let endMins = end.hour * 60 + end.min;
    
    let diff = endMins - startMins;
    if (diff < 0) diff += 1440;
    return parseFloat((diff / 60).toFixed(2));
}

function isWithin15Min(currentEnd, now) {
    const end = parseTime(currentEnd);
    const endMinutes = end.hour * 60 + end.min;
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    let diff = endMinutes - nowMinutes;
    if (diff < 0) diff += 1440;
    return diff <= 15;
}

// ==================== LIVE TIMER FUNCTION (EVERY 1 SECOND) ====================
function updateTimerOnly() {
    const now = new Date();
    const day = now.toLocaleDateString('en-US', {weekday: 'long'});
    const tasks = schedule[day] || [];
    
    document.getElementById("today").innerHTML = 
        `📅 අද : <b>${day}</b> | ${now.toLocaleString('si-LK')}`;

    let current = null, currentIndex = -1, next = null;

    for (let i = 0; i < tasks.length; i++) {
        const t = tasks[i];
        let start = new Date(), end = new Date();
        let [sh, sm] = t.start.split(":");
        let [eh, em] = t.end.split(":");
        start.setHours(sh, sm, 0, 0);
        end.setHours(eh, em, 0, 0);

        if (now >= start && now <= end) {
            current = {...t, endDate: end};
            currentIndex = i;
        }
        if (now < start && !next) next = t;
    }

    const currentDiv = document.getElementById("currentTask");
    if (current) {
        const key = getTaskKey(day, currentIndex);
        const isDone = !!completedTasks[key];
        const canTick = isWithin15Min(current.end, now) || isDone;
        let remain = Math.max(0, Math.floor((current.endDate - now) / 1000));

        currentDiv.innerHTML = `
            <div class="subject">🟢 ${current.subject}</div>
            <div class="task">${current.task}</div>
            <div class="small">${current.start} - ${current.end}</div>
            <div class="timer">${formatTime(remain)}</div>
            <div>ඉතිරි කාලය</div>
            <span class="checkbox ${isDone ? 'completed' : ''} ${!canTick ? 'disabled' : ''}" 
                  onclick="${canTick ? `toggleTask('${day}', ${currentIndex})` : ''}">${isDone ? '✔' : ''}</span>
        `;
    } else {
        currentDiv.innerHTML = `<div class="subject">😴 දැන් සැලසුම් කළ කාර්යයන් නැත</div>`;
    }

    document.getElementById("nextTask").innerHTML = next ? 
        `<div class="subject">⏭ ඊළඟ කාර්යය</div><div class="task">${next.subject} - ${next.task}</div>` : 
        `<div class="subject">🎉 අද දිනයේ සියලු වැඩ අවසන්!</div>`;
}

// ==================== DASHBOARD REFRESH FUNCTION (EVERY 20 SECONDS) ====================
function updateDashboardData() {
    const now = new Date();
    const day = now.toLocaleDateString('en-US', {weekday: 'long'});
    const tasks = schedule[day] || [];
    
    let currentIndex = -1;
    for (let i = 0; i < tasks.length; i++) {
        const t = tasks[i];
        let start = new Date(), end = new Date();
        let [sh, sm] = t.start.split(":");
        let [eh, em] = t.end.split(":");
        start.setHours(sh, sm, 0, 0);
        end.setHours(eh, em, 0, 0);
        if (now >= start && now <= end) currentIndex = i;
    }

    renderAllTasks(day, tasks, currentIndex);
    renderAnalytics(day, tasks);
}

function toggleTask(day, index) {
    const key = getTaskKey(day, index);
    completedTasks[key] = !completedTasks[key];
    saveData();
    updateTimerOnly();
    updateDashboardData(); // ටික් එක දැමූ සැනින් ප්‍රස්ථාර යාවත්කාලීන කරයි
}

function renderAllTasks(day, tasks, currentIndex) {
    let html = '';
    tasks.forEach((t, i) => {
        const key = getTaskKey(day, i);
        const isDone = !!completedTasks[key];
        html += `
            <div class="task-row ${i === currentIndex ? 'current' : ''}">
                <span class="checkbox ${isDone ? 'completed' : ''}" onclick="toggleTask('${day}', ${i})">${isDone ? '✔' : ''}</span>
                <div class="time-info">${t.start} - ${t.end}</div>
                <div style="flex:1"><strong>${t.subject}</strong> — ${t.task}</div>
            </div>`;
    });
    document.getElementById("allTasksList").innerHTML = html;
}

// ==================== ANALYTICS & CHARTS ====================
let subjectChart, dailyChart;

function renderAnalytics(day, todayTasks) {
    const todayCompleted = todayTasks.filter((_, i) => completedTasks[getTaskKey(day, i)]).length;
    const todayProgress = todayTasks.length ? Math.round((todayCompleted / todayTasks.length) * 100) : 0;

    let totalHoursStudied = 0;
    const subjectHours = {};

    todayTasks.forEach((t, i) => {
        const duration = calculateDurationInHours(t.start, t.end);
        if (!subjectHours[t.subject]) subjectHours[t.subject] = 0;
        
        if (completedTasks[getTaskKey(day, i)]) {
            subjectHours[t.subject] += duration;
            totalHoursStudied += duration;
        }
    });

    let statsHTML = `
        <div class="stat-card success"><h3>${todayProgress}%</h3><p>අද ප්‍රගතිය</p></div>
        <div class="stat-card"><h3>${todayCompleted}/${todayTasks.length}</h3><p>කාර්යයන් නිමවීම</p></div>
        <div class="stat-card success"><h3>${totalHoursStudied.toFixed(1)} h</h3><p>මුළු කැපකළ කාලය</p></div>
    `;
    document.getElementById("statsGrid").innerHTML = statsHTML;

    const subjects = Object.keys(subjectHours);
    const hoursData = subjects.map(s => subjectHours[s]);

    if (subjectChart) subjectChart.destroy();
    subjectChart = new Chart(document.getElementById('subjectChart'), {
        type: 'bar',
        data: {
            labels: subjects,
            datasets: [{
                label: 'වැඩ කළ පැය ගණන',
                data: hoursData,
                backgroundColor: ['#00ff88', '#3b82f6', '#a855f7', '#f59e0b'],
                borderRadius: 5
            }]
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false, // උස පාලනය කිරීමට මෙය අත්‍යවශ්‍යයි
            animation: { duration: 1000, easing: 'easeOutBack' },
            scales: { y: { beginAtZero: true, title: { display: true, text: 'පැය (Hours)' } } } 
        }
    });

    if (dailyChart) dailyChart.destroy();
    dailyChart = new Chart(document.getElementById('dailyChart'), {
        type: 'doughnut',
        data: {
            labels: ['සම්පූර්ණයි (%)', 'ඉතිරි (%)'],
            datasets: [{ data: [todayProgress, 100 - todayProgress], backgroundColor: ['#00ff88', '#334155'], borderWidth: 0 }]
        },
        options: { 
            responsive: true,
            maintainAspectRatio: false,
            animation: { animateScale: true, animateRotate: true, duration: 1000, easing: 'easeOutElastic' }
        }
    });
}

// ==================== INITIALIZATION & TIMERS ====================
updateTimerOnly();
updateDashboardData();

// ටයිමරය සෑම තත්පර 1කට වරක් (1000ms) ඩවුන් වෙයි
setInterval(updateTimerOnly, 1000); 

// ප්‍රස්ථාර සහ අනෙකුත් දත්ත සෑම තත්පර 20කට වරක් (20000ms) රීෆ්‍රෙෂ් වෙයි
setInterval(updateDashboardData, 20000); 
</script>
</body>
</html>

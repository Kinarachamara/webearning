<style>
    :root {
        --primary: #00ff88;
        --accent: #3b82f6;
        --bg: #0f172a;
    }
    
    body{
        font-family: 'Noto Sans Sinhala', Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
    }
    
    h1, h2 { text-align: center; }
    .container { max-width: 1320px; margin: auto; }

    .card{
        background: rgba(255,255,255,0.08);
        padding: 24px;
        margin: 18px 0;
        border-radius: 20px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.3s ease;
    }
    .card:hover { transform: translateY(-4px); }

    .current { border: 4px solid var(--primary); box-shadow: 0 0 30px rgba(0, 255, 136, 0.4); }
    .next { border: 3px solid var(--accent); }

    .subject { font-size: 30px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
    .task { font-size: 21px; margin: 10px 0; }
    .timer { font-size: 48px; color: var(--primary); font-weight: bold; margin: 18px 0; letter-spacing: 2px; }

    .checkbox {
        width: 38px; height: 38px; border: 3px solid #64748b; border-radius: 10px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 26px; cursor: pointer; flex-shrink: 0;
        transition: all 0.25s ease;
    }
    .checkbox.completed { background: #16a34a; border-color: #16a34a; color: white; transform: scale(1.1); }

    .task-row {
        display: flex; align-items: center; gap: 18px;
        padding: 16px; background: rgba(255,255,255,0.06);
        border-radius: 14px; margin-bottom: 10px;
        transition: all 0.3s ease;
    }
    .task-row:hover { transform: translateX(8px); background: rgba(255,255,255,0.1); }
    .time-info { min-width: 120px; opacity: 0.85; font-weight: 500; }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 18px;
        margin: 24px 0;
    }
    .stat-card {
        background: rgba(255,255,255,0.09);
        padding: 20px;
        border-radius: 16px;
        text-align: center;
        border-top: 5px solid var(--accent);
        transition: all 0.3s ease;
    }
    .stat-card:hover { transform: translateY(-8px); }
    .stat-card h3 { margin: 12px 0 6px 0; font-size: 32px; }
    .stat-card.success { border-top-color: var(--primary); }

    .charts-flex { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 3px; }
    .chart-container { flex: 1; min-width: 320px; background: rgba(0,0,0,0.25); padding: 20px; border-radius: 16px;max-height: 300px; }

    /* Premium Extras */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .streak {
        background: linear-gradient(90deg, #f59e0b, #ef4444);
        padding: 12px 24px;
        border-radius: 9999px;
        font-weight: bold;
        display: flex; align-items: center; gap: 10px;
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }

    .pomodoro {
        text-align: center;
        background: rgba(0,0,0,0.3);
        padding: 20px;
        border-radius: 16px;
        margin: 15px 0;
    }
    .pomo-timer { font-size: 52px; font-weight: bold; color: #f59e0b; margin: 15px 0; }
    .btn {
        padding: 10px 22px;
        border-radius: 9999px;
        border: none;
        background: rgba(255,255,255,0.1);
        color: white;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: 500;
    }
    .btn:hover { background: var(--primary); color: black; transform: scale(1.05); }
    .btn-primary { background: var(--primary); color: black; }

    .tab-bar {
        display: flex; background: rgba(255,255,255,0.05); border-radius: 9999px; padding: 6px; margin: 20px 0;
    }
    .tab {
        flex: 1; padding: 12px; text-align: center; border-radius: 9999px; cursor: pointer; transition: all 0.3s;
    }
    .tab.active { background: var(--primary); color: black; font-weight: bold; }

    .quote { font-style: italic; opacity: 0.9; text-align: center; margin: 20px 0; padding: 15px; border-left: 4px solid var(--primary); }
</style>
</head>

// ==================== FIXED STREAK ====================
function updateStreak() {
    const todayStr = new Date().toISOString().split('T')[0];
    let streak = parseInt(localStorage.getItem('studyStreak') || '0');
    let lastDate = localStorage.getItem('lastStudyDate');

    if (lastDate === todayStr) {
        document.getElementById('streakCount').textContent = streak;
        return;
    }

    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];

    if (lastDate === yesterdayStr) {
        streak++;
    } else {
        streak = 1;
    }

    localStorage.setItem('studyStreak', streak);
    localStorage.setItem('lastStudyDate', todayStr);
    document.getElementById('streakCount').textContent = streak;
}

// ==================== CORE FUNCTIONS ====================
function saveData() {
    localStorage.setItem('studyCompletedTasks', JSON.stringify(completedTasks));
}

function getTaskKey(day, index) { return `${day}-${index}`; }

function formatTime(sec){
    let h = Math.floor(sec/3600);
    let m = Math.floor((sec%3600)/60);
    let s = sec%60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function parseTime(timeStr) {
    const [hour, min] = timeStr.split(':').map(Number);
    return {hour, min};
}

function calculateDurationInHours(startStr, endStr) {
    let start = parseTime(startStr);
    let end = parseTime(endStr);
    let startMins = start.hour * 60 + start.min;
    let endMins = end.hour * 60 + end.min;
    let diff = endMins - startMins;
    if (diff < 0) diff += 1440;
    return parseFloat((diff / 60).toFixed(2));
}

function isTodayComplete(day) {
    const tasks = schedule[day] || [];
    return tasks.length > 0 && tasks.every((_, i) => completedTasks[getTaskKey(day, i)]);
}

// ==================== POMODORO ====================
function updatePomoDisplay() {
    const min = Math.floor(pomoTime / 60);
    const sec = pomoTime % 60;
    document.getElementById('pomoTimer').textContent = `${min}:${sec.toString().padStart(2,'0')}`;
}

function togglePomodoro() {
    if (isRunning) {
        clearInterval(pomoInterval);
        isRunning = false;
        document.querySelector('.btn-primary').textContent = '▶ Start';
    } else {
        isRunning = true;
        document.querySelector('.btn-primary').textContent = '⏸ Pause';
        pomoInterval = setInterval(() => {
            pomoTime--;
            updatePomoDisplay();
            if (pomoTime <= 0) {
                clearInterval(pomoInterval);
                isRunning = false;
                alert("⏰ Pomodoro Session එක අවසන්! විවේකයක් ගන්න.");
                resetPomodoro();
            }
        }, 1000);
    }
}

function pausePomodoro() {
    clearInterval(pomoInterval);
    isRunning = false;
    document.querySelector('.btn-primary').textContent = '▶ Start';
}

function resetPomodoro() {
    clearInterval(pomoInterval);
    isRunning = false;
    pomoTime = 25 * 60;
    updatePomoDisplay();
    document.querySelector('.btn-primary').textContent = '▶ Start';
}

// ==================== DASHBOARD & ANALYTICS ====================
let subjectChart, dailyChart, weeklyChart;

function renderAllTasks(day, tasks) {
    let html = '';
    tasks.forEach((t, i) => {
        const key = getTaskKey(day, i);
        const isDone = !!completedTasks[key];
        html += `
            <div class="task-row">
                <span class="checkbox ${isDone ? 'completed' : ''}" onclick="toggleTask('${day}', ${i})">${isDone ? '✔' : ''}</span>
                <div class="time-info">${t.start} - ${t.end}</div>
                <div style="flex:1"><strong>${t.subject}</strong> — ${t.task}</div>
            </div>`;
    });
    document.getElementById("allTasksList").innerHTML = html;
}

function toggleTask(day, index) {
    const key = getTaskKey(day, index);
    completedTasks[key] = !completedTasks[key];
    saveData();
    
    if (completedTasks[key]) updateStreak();
    if (isTodayComplete(day)) triggerConfetti();
    
    updateTimerOnly();
    updateDashboardData();
}

function triggerConfetti() {
    for (let i = 0; i < 80; i++) {
        setTimeout(() => {
            const confetti = document.createElement('div');
            confetti.style.position = 'fixed';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-10px';
            confetti.style.fontSize = '24px';
            confetti.textContent = ['🎉','🏆','⭐','🔥'][Math.floor(Math.random()*4)];
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 4000);
        }, i * 30);
    }
}

function renderAnalytics(day, todayTasks) {
    const todayCompleted = todayTasks.filter((_, i) => completedTasks[getTaskKey(day, i)]).length;
    const todayProgress = todayTasks.length ? Math.round((todayCompleted / todayTasks.length) * 100) : 0;

    let totalHoursStudied = 0;
    const subjectHours = {};

    todayTasks.forEach((t, i) => {
        const duration = calculateDurationInHours(t.start, t.end);
        if (!subjectHours[t.subject]) subjectHours[t.subject] = 0;
        if (completedTasks[getTaskKey(day, i)]) {
            subjectHours[t.subject] += duration;
            totalHoursStudied += duration;
        }
    });

    let statsHTML = `
        <div class="stat-card success"><h3>${todayProgress}%</h3><p>අද ප්‍රගතිය</p></div>
        <div class="stat-card"><h3>${todayCompleted}/${todayTasks.length}</h3><p>කාර්යයන් නිමවීම</p></div>
        <div class="stat-card success"><h3>${totalHoursStudied.toFixed(1)} h</h3><p>මුළු කැපකළ කාලය</p></div>
    `;
    document.getElementById("statsGrid").innerHTML = statsHTML;

    const subjects = Object.keys(subjectHours);
    const hoursData = subjects.map(s => subjectHours[s]);

    if (subjectChart) subjectChart.destroy();
    subjectChart = new Chart(document.getElementById('subjectChart'), {
        type: 'bar',
        data: {
            labels: subjects,
            datasets: [{ label: 'පැය ගණන', data: hoursData, backgroundColor: ['#00ff88','#3b82f6','#a855f7','#f59e0b'], borderRadius: 8 }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
    });

    if (dailyChart) dailyChart.destroy();
    dailyChart = new Chart(document.getElementById('dailyChart'), {
        type: 'doughnut',
        data: {
            labels: ['සම්පූර්ණයි', 'ඉතිරි'],
            datasets: [{ data: [todayProgress, 100 - todayProgress], backgroundColor: ['#00ff88', '#475569'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

function renderWeekly() {
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const progressData = days.map(day => {
        const tasks = schedule[day] || [];
        const done = tasks.filter((_,i) => completedTasks[getTaskKey(day,i)]).length;
        return tasks.length ? Math.round(done / tasks.length * 100) : 0;
    });

    if (weeklyChart) weeklyChart.destroy();
    weeklyChart = new Chart(document.getElementById('weeklyChart'), {
        type: 'line',
        data: {
            labels: days,
            datasets: [{ label: 'ප්‍රගතිය (%)', data: progressData, borderColor: '#00ff88', tension: 0.4, borderWidth: 4 }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

function updateDashboardData() {
    const now = new Date();
    const day = now.toLocaleDateString('en-US', {weekday: 'long'});
    const tasks = schedule[day] || [];
    renderAllTasks(day, tasks);
    renderAnalytics(day, tasks);
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i === tab));
    document.getElementById('tab0').style.display = tab === 0 ? 'block' : 'none';
    document.getElementById('tab1').style.display = tab === 1 ? 'block' : 'none';
    document.getElementById('tab2').style.display = tab === 2 ? 'block' : 'none';
    
    if (tab === 1) renderWeekly();
}

// Data Export / Import / Reset
function exportData() {
    const data = { completedTasks, exportDate: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `study-progress-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                completedTasks = data.completedTasks || completedTasks;
                saveData();
                location.reload();
            } catch(e) { alert("Import අසාර්ථකයි"); }
        };
        reader.readAsText(e.target.files[0]);
    };
    input.click();
}

function resetToday() {
    if (confirm("අද දිනයේ සියලු කාර්යයන් reset කරන්නද?")) {
        const now = new Date();
        const day = now.toLocaleDateString('en-US', {weekday: 'long'});
        (schedule[day] || []).forEach((_,i) => delete completedTasks[getTaskKey(day,i)]);
        saveData();
        updateTimerOnly();
        updateDashboardData();
    }
}

// ==================== INITIALIZATION ====================
updateStreak();
updateTimerOnly();
updateDashboardData();
updatePomoDisplay();
updateQuote();   // ← Quotes සඳහා

setInterval(updateTimerOnly, 1000);
setInterval(() => { if (currentTab === 2) updateDashboardData(); }, 20000);

// ටිකක් කාලයකට එක පාරක් quote වෙනස් කරන්න
setInterval(updateQuote, 45000); // 45 seconds
</script>
